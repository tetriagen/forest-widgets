# Graphite Glass — matched to the graphite waves desktop

# Typography: install JetBrainsMono Nerd Font before use.
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0
window_padding_width 12

# Subtle transparency over the graphite wallpaper.
background_opacity 0.88

# Block cursor with a soft trailing animation.
shell_integration no-cursor
cursor_shape block
cursor_shape_unfocused hollow
cursor #ef2b33
cursor_text_color #ffffff
cursor_blink_interval 0.6
cursor_trail 1
cursor_trail_decay 0.12 0.35
cursor_trail_start_threshold 1

# Main colors.
background #101113
foreground #eeeeee
selection_background #592328
selection_foreground #ffffff
url_color #ef6268

# Normal ANSI colors.
color0 #222429
color1 #ef2b33
color2 #b4b4b8
color3 #babac0
color4 #aaaab2
color5 #c5c5cb
color6 #b5b5bc
color7 #D0D2D8

# Bright ANSI colors.
color8 #777B86
color9 #ff6268
color10 #dedee2
color11 #e1e1e5
color12 #d0d0d8
color13 #e4e4e8
color14 #dddde3
color15 #F3F4F6

# Quiet borders and a compact tab bar, visible when multiple tabs exist.
active_border_color #ef2b33
inactive_border_color #292a2c
bell_border_color #ef2b33
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #ffffff
active_tab_background #ef2b33
active_tab_font_style bold
inactive_tab_foreground #999999
inactive_tab_background #191a1c
tab_bar_background #101113
